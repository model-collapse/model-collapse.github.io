baseURL = "https://model-collapse.github.io/"
languageCode = "en-us"
title = "Charlie Yang"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 8

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  mainSections = ["beginners", "professionals"]

  [params.homeInfoParams]
    Title = "Hi, I'm Charlie Yang 👋"
    Content = """
I'm a machine-learning engineer at **Amazon Web Services**, working on **OpenSearch** — search, retrieval, and neural / vector search at scale. Based in Shanghai. 🇨🇳

The thread through my work is the same one that runs through good search: **given a query and some candidates, make the right call — fast, and for the right reasons.** Lately that's pulled me toward **decision-making models and AI agents** — small, *typed* decisions (choose one, score, yes/no) that have to be quick, calibrated, and honestly evaluated. My open-source [JevBench](https://github.com/model-collapse/jev-bench) benchmark grew out of exactly that itch.

I write about all of it here, on **two tracks** — pick the one that fits you:

- 🌱 **[For AI Beginners](/beginners/)** — plain-language explainers of ML concepts, intuition and examples first, no jargon left undefined.
- 🛠️ **[For AI Professionals](/professionals/)** — deeper technical write-ups: retrieval, model architecture, calibration, benchmarks, and lessons from shipping real systems.

New here? Start with the beginners track. Building things? Head to the professionals track.
"""

  [[params.socialIcons]]
    name = "linkedin"
    title = "LinkedIn"
    url = "https://www.linkedin.com/in/charlieyangnju/"
  [[params.socialIcons]]
    name = "github"
    title = "GitHub"
    url = "https://github.com/model-collapse"
  [[params.socialIcons]]
    name = "rss"
    title = "RSS"
    url = "/index.xml"

[[menu.main]]
  identifier = "beginners"
  name = "For AI Beginners"
  url = "/beginners/"
  weight = 1
[[menu.main]]
  identifier = "professionals"
  name = "For AI Professionals"
  url = "/professionals/"
  weight = 2
[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 3
[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 4

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.highlight]
  noClasses = false
  style = "github"
